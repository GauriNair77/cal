<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div>
                <input type="text" id="result" readonly>
            </div>
            <button class="bu">1</button>
            <button class="bu">2</button>
            <button class="bu">3</button>
            <button class="b">+</button><br>
            <button class="bu">4</button>
            <button class="bu">5</button>
            <button class="bu">6</button>
            <button class="b">-</button><br>
            <button class="bu">7</button>
            <button class="bu">8</button>
            <button class="bu">9</button>
            <button class="b">*</button><br>
            <button class="b">C</button>
            <button class="bu">0</button>
            <button class="b">/</button>
            <button class="equals">=</button>
        </div>
    </div>
</body>
</html>
